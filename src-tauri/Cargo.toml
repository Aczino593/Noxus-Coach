[package]
name = "noxus-coach"
version = "0.1.0"
description = "Coaching y analítica de League of Legends — Crimson / Noxus"
edition = "2021"

[lib]
name = "noxus_coach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
